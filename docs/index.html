rovincial directorates.","hero_p":"In 2024 the communities living on top of the ruby, the coal and the gas received less than a third of what went to the provincial capitals. Nobody explains why.","cmp_title":"Where the extractive money went in 2024","cmp_com":"Affected communities","cmp_prov":"Provincial directorates","quote":"the budget execution report does not allow us to determine what criterion was used to split the amount allocated to each community, nor what activities the funds went to","quote_src":"EITI Mozambique, the official transparency body, in its 2020 and 2021 reports","trend_title":"Total transferred to communities, by year","trend_note":"In 2022 the figure falls 39%; in 2024 it quadruples. The reports explain neither move.","find_title":"Find your locality","map_title":"Where the 2.75% lands","map_sub":"Total per province in the selected year. Tap a province to filter the list.","map_low":"less","map_high":"more","map_none":"No transfer recorded","map_all":"All provinces","map_year":"Year","updated":"Data from 2019 to 2024. Updated"},"fr":{"title":"Quinhão","lang_name":"Français","tagline":"La part de votre communauté sur les 2,75 % miniers.","intro":"La loi verse 2,75 % de l'impôt sur la production minière et pétrolière aux communautés où se fait l'extraction. Choisissez votre localité et voyez le montant.","pick":"Choisissez votre localité","search":"Chercher une localité ou un district…","nomatch":"Aucune localité trouvée.","received":"Transféré à cette localité","year":"Année","amount":"Montant","mineral":"Activité minière","total":"Total sur 6 ans","mzn_m":"millions MZN","no_data":"Aucun transfert enregistré cette année.","next_title":"Ce que vous pouvez en faire","next_body":"L'organe responsable de cet argent est le <strong>Secrétariat de district</strong>, avec le <strong>Conseil consultatif de localité</strong>. La loi limite les dépenses à quatre domaines :","ask_title":"Questions que vous avez le droit de poser","asks":["À quels projets le montant de cette année a-t-il servi ?","Où sont les procès-verbaux du Conseil consultatif approuvant ces projets ?","Les travaux sont-ils terminés ? Puis-je voir le procès-verbal de réception ?"],"source_title":"D'où viennent ces chiffres","source_body":"Rapports ITIE Mozambique, publiés sur eiti.org. Aucun chiffre n'a été saisi à la main — ils sont extraits des PDF officiels par un programme qui échoue si les totaux ne correspondent pas à ceux publiés.","caveat_title":"Ce que ces chiffres ne disent pas","caveat_body":"L'État déclare 100 % d'exécution — l'argent est sorti. Cela ne veut pas dire que quelque chose a été construit. Et l'ITIE écrit elle-même que le critère de répartition entre communautés ne peut être déterminé.","note2022":"2022 est absent ci-dessus : cette année-là, le rapport officiel publie les dépenses par projet au niveau national, sans répartition par localité.","hero_kicker":"Ce que la loi promet aux communautés minières","hero_h":"318,7 millions aux communautés.<br>840,3 millions aux directions provinciales.","hero_p":"En 2024, les communautés qui vivent sur le rubis, le charbon et le gaz ont reçu moins d'un tiers de ce qui est allé aux capitales provinciales. Personne n'explique pourquoi.","cmp_title":"Où est allé l'argent extractif en 2024","cmp_com":"Communautés affectées","cmp_prov":"Directions provinciales","quote":"le rapport d'exécution budgétaire ne permet pas de déterminer le critère utilisé pour répartir le montant alloué à chaque communauté, ni les activités financées","quote_src":"ITIE Mozambique, l'organisme officiel de transparence, rapports 2020 et 2021","trend_title":"Total transféré aux communautés, par année","trend_note":"En 2022 le montant chute de 39 % ; en 2024 il quadruple. Les rapports n'expliquent ni l'un ni l'autre.","find_title":"Trouvez votre localité","map_title":"Où atterrissent les 2,75 %","map_sub":"Total par province pour l'année choisie. Touchez une province pour filtrer la liste.","map_low":"moins","map_hi let year=2024, prov=null;
let lang=(navigator.language||"pt").slice(0,2); if(!T[lang]) lang="pt";
let picked=null;
const $=id=>document.getElementById(id);
const loc=()=>lang==="en"?"en-GB":lang==="fr"?"fr-FR":"pt-PT";
const fmt=n=>n.toLocaleString(loc(),{minimumFractionDigits:1,maximumFractionDigits:1});
/* One glyph per commodity: identity at a glance, zero bytes over the wire. */
const ICONS={
 rubi:'<path d="M5 3h14l3 6-10 12L2 9z"/><path d="M2 9h20M9 3 7 9l5 12M15 3l2 6-5 12" fill="none" stroke="var(--bg)" stroke-width="1.1"/>',
 carvao:'<path d="M7 5 3 13l5 6 7-1 6-6-4-7z"/><path d="m7 5 4 7-3 7M15 18l-4-6 9-2" fill="none" stroke="var(--bg)" stroke-width="1.1"/>',
 gas:'<path d="M12 2c3 4 5 6 5 9a5 5 0 1 1-10 0c0-2 1-3 2-5 1 2 2 2 2 4 0-3 .5-5 1-8z"/>',
 areia:'<circle cx="7" cy="16" r="3"/><circle cx="14" cy="17" r="2.2"/><circle cx="11" cy="10" r="2.6"/><circle cx="18" cy="12" r="1.8"/><circle cx="5" cy="9" r="1.6"/>',
 agua:'<path d="M12 2c4 6 6 8 6 11a6 6 0 0 1-12 0c0-3 2-5 6-11z"/>',
 ouro:'<path d="M3 8h18l-2 10H5z"/><path d="M3 8 6 4h12l3 4" fill="none" stroke="var(--bg)" stroke-width="1.1"/>',
 pedra:'<path d="M4 9 9 4l7 1 4 6-3 9H7z"/>'};
function icon(activity){
  const a=(activity||"").toLowerCase();
  const k=/rubi/.test(a)?"rubi":/carv/.test(a)?"carvao":/g[aá]s|lng|condes/.test(a)?"gas":
    /areia|ilmen|iimen|zirc|titan|turmal|tantal|grafite/.test(a)?"areia":
    /[aá]gua/.test(a)?"agua":/ouro|bauxit/.test(a)?"ouro":
    /granito|calc|saibro|brita|riolito|pedra|guano/.test(a)?"pedra":null;
  return k?`<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[k]}</svg>`:"";
}
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* Horizontal bars: two categories, direct-labelled, 4px rounded data-end. */
function hbars(svg,items){
  const W=640,rowH=64,max=Math.max(...items.map(i=>i.v));
  svg.setAttribute("viewBox",`0 0 ${W} ${items.length*rowH}`);
  svg.innerHTML=items.map((it,i)=>{
    const y=i*rowH, w=Math.max(4,(W-95)*it.v/max);
    return `<g><title>${esc(it.k)}: ${fmt(it.v)}</title>`+
      `<text class="lbl" x="0" y="${y+16}">${esc(it.k)}</text>`+
      `<rect x="0" y="${y+24}" width="${w}" height="26" rx="4" fill="${it.c}"/>`+
      `<text class="val" x="${w+12}" y="${y+44}">${fmt(it.v)}</text></g>`;
  }).join("");
}

/* Vertical bars over time: one series, one hue, every bar labelled. */
function vbars(svg,items,color){
  const W=640,H=220,base=H-34,top=26,max=Math.max(...items.map(i=>i.v)),
        n=items.length,gap=10,bw=(W-(n-1)*gap)/n;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=`<line class="axis" x1="0" y1="${base}" x2="${W}" y2="${base}"/>`+
    items.map((it,i)=>{
      const h=Math.max(3,(base-top)*it.v/max), x=i*(bw+gap), y=base-h;
      return `<g><title>${esc(it.k)}: ${fmt(it.v)}</title>`+
        `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${color}"/>`+
        `<text class="val" x="${x+bw/2}" y="${y-8}" text-anchor="middle">${fmt(it.v)}</text>`+
        `<text class="lbl" x="${x+bw/2}" y="${base+20}" text-anchor="middle">${esc(it.k)}</text></g>`;
    }).join("");
}

/* Province totals for a year, straight from the same locality rows the list uses. */
function provTotals(y){
  const t={};
  for(const e of DATA){const v=e.y[String(y)]; if(v!=null) t[e.p]=(t[e.p]||0)+v;}
  return t;
}

function drawMap(){
  const tot=provTotals(year), vals=Object.values(tot).filter(v=>v>0).sort((a,b)=>a-b);
  const step=v=>{
    if(!(v>0)) return "var(--m0)";
    const i=Math.min(4,Math.floor(vals.indexOf(v)/vals.length*5));
    return `var(--m${i+1})`;
  };
  $("map").innerHTML=Object.entries(MAP).map(([name,d])=>{
    const v=tot[name]||0;
    return `<path d="${d}" fill="${step(v)}" data-p="${esc(name)}" tabindex="0" role="button"`+
      (prov===name?' aria-current="true"':"")+
      `><title>${esc(name)}: ${v>0?fmt(v)+" "+T[lang].mzn_m:T[lang].map_none}</title></path>`;
  }).join("");
  $("plist").innerHTML=Object.entries(MAP).map(([n])=>[n,tot[n]||0])
    .sort((a,b)=>b[1]-a[1]).map(([n,v])=>
      `<li><span>${esc(n)}</span><b>${v>0?fmt(v):"—"}</b></li>`).join("");
}
$("map").addEventListener("click",e=>{
  const pth=e.target.closest("path"); if(!pth) return;
  prov = prov===pth.dataset.p ? null : pth.dataset.p;
  drawMap(); search();
});
$("map").addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.click();}
});
$("years").addEventListener("click",e=>{
  const y=e.target.dataset.y; if(!y) return;
  year=+y; drawMap();
  [...$("years").children].forEach(b=>b.setAttribute("aria-pressed",+b.dataset.y===year));
});

$("langs").innerHTML=Object.keys(T).map(k=>
  `<button data-l="${k}" type="button">${T[k].lang_name}</button>`).join("");
$("langs").onclick=e=>{const l=e.target.dataset.l; if(l){lang=l; render();}};

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  const text={kicker:t.hero_kicker,herop:t.hero_p,"cmp-t":t.cmp_title,
    quote:"“"+t.quote+"”","quote-src":t.quote_src,"trend-t":t.trend_title,
    "trend-note":t.trend_note,"find-t":t.find_title,picklbl:t.pick,nomatch:t.nomatch,
    "h-year":t.year,"h-amt":t.amount,"r-totlbl":t.total,"r-unit":t.mzn_m,
    "n-title":t.next_title,"a-title":t.ask_title,"s-title":t.source_title,
    "s-body":t.source_body,"c-title":t.caveat_title,"c-body":t.caveat_body,
    "r-note2022":t.note2022,"f-upd":t.updated,"cmp-s":t.mzn_m,"trend-s":t.mzn_m};
  for(const [id,v] of Object.entries(text)) $(id).textContent=v;
  $("heroh").innerHTML=t.hero_h;
  $("n-body").innerHTML=t.next_body;
  $("q").placeholder=t.search;
  $("n-uses").innerHTML=USES[lang].map(u=>`<li>${esc(u)}</li>`).join("");
  $("a-list").innerHTML=t.asks.map(a=>`<li>${esc(a)}</li>`).join("");
  [...$("langs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));

  $("map-t").textContent=t.map_title; $("map-s").textContent=t.map_sub;
  $("lg-low").textContent=t.map_low; $("lg-high").textContent=t.map_high;
  $("years").innerHTML=YEARS.map(y=>
    `<button type="button" data-y="${y}" aria-pressed="${y===year}">${y}</button>`).join("");
  drawMap();
  hbars($("cmp"),[{k:t.cmp_com,v:NATIONAL["2024"],c:css("--s1")},
                  {k:t.cmp_prov,v:PROVINCES,c:css("--s2")}]);
  vbars($("trend"),Object.entries(NATIONAL).map(([k,v])=>({k,v})),css("--s1"));
  search(); if(picked) show(picked);
}

function search(){
  const q=$("q").value.trim().toLowerCase();
  if(!q&&!prov){$("hits").innerHTML="";$("nomatch").hidden=true;return;}
  const hits=DATA.filter(e=>(!prov||e.p===prov)&&
    (!q||(e.l+" "+e.d+" "+e.p).toLowerCase().includes(q))).slice(0,60);
  $("nomatch").hidden=hits.length>0;
  $("hits").innerHTML=hits.map(e=>
    `<li><button type="button" data-k="${esc(e.l)}|${esc(e.d)}">${icon(e.m)}${esc(e.l)}`+
    `<small>${esc(e.d)}, ${esc(e.p)}</small></button></li>`).join("");
}
$("q").oninput=search;
$("hits").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  const [l,d]=b.dataset.k.split("|");
  picked=DATA.find(x=>x.l===l&&x.d===d);
  $("q").value=""; search(); show(picked);
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
};

function show(e){
  const t=T[lang];
  $("result").hidden=false;
  $("r-title").textContent=`${t.received}: ${e.l}`;
  $("r-where").innerHTML=icon(e.m)+esc([e.d,e.p,e.m].filter(Boolean).join(" · "));
  const got=YEARS.filter(y=>e.y[String(y)]!=null).map(y=>({k:String(y),v:e.y[String(y)]}));
  vbars($("r-chart"),got.length?got:[{k:"—",v:0}],css("--s1"));
  $("r-total").textContent=fmt(got.reduce((a,b)=>a+b.v,0));
  $("r-rows").innerHTML=YEARS.map(y=>{
    const v=e.y[String(y)];
    return `<tr><td>${y}</td><td class="n">${v!=null?fmt(v)+" "+t.mzn_m:
      '<span class="note">'+t.no_data+'</span>'}</td></tr>`;
  }).join("");
}
render();
